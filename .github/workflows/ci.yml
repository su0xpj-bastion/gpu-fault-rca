name: ci
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unit + scenario tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: junit, path: reports/}

  rca-matrix:
    name: RCA matrix + recovery validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt && pip install -e .
      - name: precision / recall over the scenario library (gate >= 0.95)
        run: chaos matrix --seeds 1 2 3 ${{ github.run_number }} --out reports
      - name: recovery-path validation
        run: chaos recover --out reports
      - name: sample incident report
        if: always()
        run: |
          chaos run gpu_fallen_off_bus --seed ${{ github.run_number }} --out bundles/sample
          rca analyze bundles/sample --out reports/sample || true
      - name: job summary
        if: always()
        run: |
          cat reports/matrix.md reports/recovery.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/sample/incident.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: rca-reports, path: "reports/\nbundles/sample/"}
